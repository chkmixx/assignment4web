
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms and Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Forms and Validation</h1>

    <h2>Task 0 - Contact Form</h2>

    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message"></textarea><br><br>

        <button type="submit">Submit</button>
    </form>
    <h2>Task 1 - HTML5 Validation</h2>

<form>
    <label for="name2">Name:</label><br>
    <input type="text" id="name2" name="name" required maxlength="30">
    <br><br>

    <label for="email2">Email:</label><br>
    <input type="email" id="email2" name="email" required>
    <br><br>

    <label for="message2">Message:</label><br>
    <textarea id="message2" name="message" required maxlength="200"></textarea>
    <br><br>

    <button type="submit">Send</button>
</form>
<h2>Task 2 - Bootstrap Form Styling</h2>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <form>
                <div class="mb-3">
                    <label for="name3" class="form-label">Name:</label>
                    <input type="text" class="form-control" id="name3" name="name" placeholder="Enter your name">
                </div>

                <div class="mb-3">
                    <label for="email3" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email3" name="email" placeholder="Enter your email">
                    <div class="form-text">We wont share your email w anyone.</div>
                </div>

                <div class="mb-3">
                    <label for="message3" class="form-label">Message:</label>
                    <textarea class="form-control" id="message3" name="message" rows="4" placeholder="Write your message"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</div>
<h2>Task 3 - Bootstrap Validation Styles</h2>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <form>
                <div class="mb-3">
                    <label for="name4" class="form-label">Name:</label>
                    <input type="text" class="form-control is-valid" id="name4" value="Tomiris" required>
                    <div class="valid-feedback">Looks good!</div>
                </div>

                <div class="mb-3">
                    <label for="email4" class="form-label">Email:</label>
                    <input type="email" class="form-control is-invalid" id="email4" value="wrong-email" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>

                <div class="mb-3">
                    <label for="message4" class="form-label">Message:</label>
                    <textarea class="form-control is-invalid" id="message4" required></textarea>
                    <div class="invalid-feedback">Message is required.</div>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
